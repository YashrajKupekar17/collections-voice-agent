[project]
name = "yk-voice-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.50",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "pipecat-ai[deepgram,openai,runner,silero,webrtc]>=1.17.0",
    "twilio>=9.13.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
